<!doctype html>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arbeitsplatz">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex, nofollow">

<meta name="theme-color" content="#131614" media="(prefers-color-scheme: dark)">

<title>Arbeitsplatz mobil</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: eine Spalte, Kopfzeile oben (sticky), Reiterleiste unten (fixed); Listen als ruhige Zeilen, Karten nur für Kennzahlen.
   Farben wie arbeitsplatz.html: je Tool eine Akzentfarbe. */
:root{
  --bg:#EEF0EC; --surface:#FBFBF8; --ink:#1C211F; --ink-2:#56605B; --ink-3:#86908A; --line:#D7DCD5; --hover:#E6E9E4;
  --focus:#3572B0; --warn:#9A5B00; --warn-soft:#F6EAD3; --ok:#2E8055;
  --c-lehre:#24477A; --c-lehre-soft:#E2E8F2;
  --c-betr:#7C2D3B; --c-betr-soft:#F2E3E3;
  --c-gfv:#2F5D50; --c-gfv-soft:#E1ECE6;
  --c-dep:#8A5A14; --c-dep-soft:#F3E7D2;
  --st-kontakt:#3572b0; --st-angemeldet:#a8710a; --st-begutachtung:#7a5cc4; --st-abgeschlossen:#2e8055; --st-abgebrochen:#8b3a62;
  --mark:#F5E3A6;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --tabbar-h:58px;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131614; --surface:#1B1F1D; --ink:#E8ECE8; --ink-2:#AAB3AD; --ink-3:#7C857F; --line:#2E3431; --hover:#232825;
  --focus:#6FA2DB; --warn:#E0A955; --warn-soft:#3A2F1F; --ok:#42a374;
  --c-lehre:#8FB0E3; --c-lehre-soft:#1F2B3D;
  --c-betr:#E08D97; --c-betr-soft:#35222A;
  --c-gfv:#7CB79E; --c-gfv-soft:#1E2F28;
  --c-dep:#E0B56E; --c-dep-soft:#3A2F1F;
  --st-kontakt:#5b94d6; --st-angemeldet:#c6852a; --st-begutachtung:#a47dd1; --st-abgeschlossen:#42a374; --st-abgebrochen:#b85a98;
  --mark:#5A4A16;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#131614; --surface:#1B1F1D; --ink:#E8ECE8; --ink-2:#AAB3AD; --ink-3:#7C857F; --line:#2E3431; --hover:#232825;
  --focus:#6FA2DB; --warn:#E0A955; --warn-soft:#3A2F1F; --ok:#42a374;
  --c-lehre:#8FB0E3; --c-lehre-soft:#1F2B3D;
  --c-betr:#E08D97; --c-betr-soft:#35222A;
  --c-gfv:#7CB79E; --c-gfv-soft:#1E2F28;
  --c-dep:#E0B56E; --c-dep-soft:#3A2F1F;
  --st-kontakt:#5b94d6; --st-angemeldet:#c6852a; --st-begutachtung:#a47dd1; --st-abgeschlossen:#42a374; --st-abgebrochen:#b85a98;
  --mark:#5A4A16;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
input[type=search]::-webkit-search-cancel-button,input[type=search]::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent,var(--focus))}

/* Kopfzeile */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px;min-height:52px;padding:6px 16px}
.top h1{flex:1;min-width:0;margin:0;font-family:var(--serif);font-weight:600;font-size:1.22rem;line-height:1.2;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:2px;min-width:40px;height:40px;padding:0 6px;margin-left:-8px;border:0;background:none;color:var(--accent,var(--ink));border-radius:8px;cursor:pointer;font-size:.95rem}
.iconbtn:active{background:var(--hover)}
.iconbtn svg{width:22px;height:22px}
.iconbtn.right{margin-left:0;margin-right:-8px;color:var(--ink-2)}

main{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:14px calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px) + 28px)}

/* Reiterleiste */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabbar-h)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.68rem;font-weight:500;color:var(--ink-3);cursor:pointer;letter-spacing:.01em}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--tc)}
.tab[data-t="home"]{--tc:var(--ink)} .tab[data-t="lehre"]{--tc:var(--c-lehre)} .tab[data-t="arbeiten"]{--tc:var(--c-betr)} .tab[data-t="gfv"]{--tc:var(--c-gfv)} .tab[data-t="deputat"]{--tc:var(--c-dep)}

/* Akzent je Bereich */
.t-lehre{--accent:var(--c-lehre);--soft:var(--c-lehre-soft)}
.t-arbeiten{--accent:var(--c-betr);--soft:var(--c-betr-soft)}
.t-gfv{--accent:var(--c-gfv);--soft:var(--c-gfv-soft)}
.t-deputat{--accent:var(--c-dep);--soft:var(--c-dep-soft)}
.t-home{--accent:var(--ink);--soft:var(--hover)}

/* Grundbausteine */
.stack{display:flex;flex-direction:column;gap:18px}
.eyebrow{margin:0;font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);font-weight:600}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
h2.sec{margin:6px 0 0;font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);font-weight:600}
.lead{margin:0;font-family:var(--serif);font-size:1.5rem;font-weight:600;line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.88rem;color:var(--ink-2)}

.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.search input{width:100%;height:46px;padding:0 40px 0 40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px;-webkit-appearance:none;appearance:none}
.search input:focus{outline:2px solid var(--accent,var(--focus));outline-offset:-1px;border-color:transparent}
.search .clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:none;color:var(--ink-3);border-radius:8px;cursor:pointer;font-size:1.2rem}

.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.list > li + li{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;text-align:left;border:0;background:none;color:inherit;text-decoration:none;cursor:pointer;min-height:52px}
.row:active{background:var(--hover)}
.row-main{flex:1;min-width:0}
.row-title{font-weight:500;line-height:1.3;overflow-wrap:anywhere}
.row-sub{font-size:.86rem;color:var(--ink-2);line-height:1.35;margin-top:2px;overflow-wrap:anywhere}
.row-end{flex:none;text-align:right;font-size:.86rem;color:var(--ink-2)}
.chev{flex:none;width:16px;height:16px;color:var(--ink-3)}
.row.static{cursor:default}.row.static:active{background:none}
.group-head{padding:8px 14px 6px;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--ink-3);background:var(--bg)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:99px;font-size:.76rem;font-weight:500;white-space:nowrap;background:var(--soft,var(--hover));color:var(--accent,var(--ink-2))}
.pill.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.neutral{background:var(--hover);color:var(--ink-2)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.st{background:color-mix(in srgb,var(--sc) 14%,var(--surface));color:var(--sc)}
.st-kontakt{--sc:var(--st-kontakt)} .st-angemeldet{--sc:var(--st-angemeldet)} .st-begutachtung{--sc:var(--st-begutachtung)} .st-abgeschlossen{--sc:var(--st-abgeschlossen)} .st-abgebrochen{--sc:var(--st-abgebrochen)}

.seg{display:flex;padding:3px;gap:3px;background:var(--hover);border-radius:10px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;padding:7px 10px;border-radius:8px;font-size:.88rem;font-weight:500;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent,var(--ink));box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:.84rem;color:var(--ink-2);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--soft)}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;text-align:left;color:inherit;text-decoration:none;cursor:pointer;border-top:3px solid var(--accent)}
.tile.plain{border-top-width:1px;cursor:default}
.tile-label{font-size:.78rem;color:var(--ink-2);font-weight:500}
.tile-value{font-family:var(--serif);font-size:1.6rem;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.tile-hint{font-size:.76rem;color:var(--ink-3)}
.tool-tile .tile-value{font-size:1.15rem;font-family:var(--serif)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
dl.fields{margin:0;display:grid;grid-template-columns:minmax(0,40%) minmax(0,1fr);gap:0}
dl.fields dt,dl.fields dd{padding:9px 0;border-top:1px solid var(--line);margin:0}
dl.fields dt:first-of-type,dl.fields dt:first-of-type + dd{border-top:0}
dl.fields dt{color:var(--ink-2);font-size:.9rem;padding-right:12px}
dl.fields dd{overflow-wrap:anywhere}
.prose{overflow-wrap:anywhere}
.prose p{margin:0 0 .6em}.prose p:last-child{margin-bottom:0}
.prose ul{margin:.2em 0 .6em;padding-left:1.25em}
.prose li{margin:.15em 0}
.prose h4{font-size:1rem;margin:.8em 0 .3em}
.note-text{white-space:pre-wrap;overflow-wrap:anywhere}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.todo{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.box{flex:none;width:18px;height:18px;margin-top:3px;border:1.5px solid var(--ink-3);border-radius:4px;display:inline-flex;align-items:center;justify-content:center}
.box.done{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.box svg{width:12px;height:12px}
.todo.done .todo-text{color:var(--ink-3);text-decoration:line-through}

.file{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.file:first-child{border-top:0;padding-top:0}
.file-ico{flex:none;width:20px;height:20px;color:var(--ink-3);margin-top:2px}
.path{font-family:var(--mono);font-size:.76rem;color:var(--ink-2);overflow-wrap:anywhere;margin-top:2px}
.copy{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;font-size:.8rem;color:var(--ink-2);cursor:pointer}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.danger{color:var(--st-abgebrochen)}
.btn svg{width:18px;height:18px}
.btnrow{display:flex;flex-wrap:wrap;gap:10px}

.notice{display:flex;gap:10px;padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--ink);font-size:.9rem}
.notice.info{background:var(--hover)}
.empty{text-align:center;padding:28px 16px;color:var(--ink-2)}
.empty h2{font-family:var(--serif);font-weight:600;font-size:1.3rem;color:var(--ink);margin:0 0 6px}

.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.datafile{display:flex;gap:12px;align-items:flex-start;padding:12px 14px}
.datafile + .datafile{border-top:1px solid var(--line)}
.swatch{flex:none;width:10px;height:10px;border-radius:50%;margin-top:7px;background:var(--accent)}

.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pager .btn{justify-content:flex-start;min-width:0;padding:8px 12px;height:auto;flex-direction:column;align-items:flex-start;gap:0;text-align:left}
.pager .btn.next{align-items:flex-end;text-align:right}
.pager small{color:var(--ink-3);font-size:.74rem}
.pager span{font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}

.dep-num{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:6px;font-size:.78rem;color:var(--ink-2);text-align:center}
.dep-num b{display:block;font-family:var(--mono);font-weight:500;color:var(--ink);font-size:.9rem}
.hint-u{color:var(--st-abgebrochen)} .hint-w{color:var(--warn)}
details.rules{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
details.rules summary{cursor:pointer;font-weight:500}
details.rules ul{padding-left:1.2em;margin:.6em 0 0;font-size:.9rem;color:var(--ink-2)}

.toast{position:fixed;left:50%;bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:12px;font-size:.88rem;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:calc(100% - 32px)}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (min-width:600px){.tiles.four{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>

<div id="app" class="t-home">
  <header class="top"><div class="top-in">
    <button class="iconbtn" id="back" hidden aria-label="Zurück"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h1 id="title">Arbeitsplatz</h1>
    <button class="iconbtn right" id="dataBtn" aria-label="Daten einlesen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"/><path d="M8 8l4-4 4 4"/><path d="M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg></button>
  </div></header>
  <main id="view"></main>
  <nav class="tabs" aria-label="Bereiche"><div class="tabs-in">

    <button class="tab" data-t="lehre"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v15H5.5A1.5 1.5 0 0 1 4 17.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v15h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg>Lehre</button>
    <button class="tab" data-t="arbeiten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/><path d="M10 12h5M10 15.5h5"/></svg>Arbeiten</button>

    <button class="tab" data-t="deputat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Deputat</button>
  </div></nav>
</div>

<script>
/* =====================================================================
   WorkToolsData – Einlesen und Auswerten der vier Datendateien.
   Reiner Code ohne Bildschirmausgabe, damit das spätere Dashboard ihn
   unverändert übernehmen kann (window.WorkToolsData).
   ===================================================================== */
(function (root) {
  "use strict";
  var TOOLS = {
    seminarbuch: { key: "seminarbuch", label: "Seminarbuch", file: "seminarbuch-daten.json", folder: "seminarbuch", tab: "lehre" },
    betreuung: { key: "betreuung", label: "Betreuungsübersicht", file: "betreuungsuebersicht-daten.json", folder: "Abschlussarbeiten", tab: "arbeiten" },
    gfv: { key: "gfv", label: "GfV-Protokolle", file: "gfv-protokolle-daten.json", folder: "gfv_protokolle", tab: "gfv" },
    deputat: { key: "deputat", label: "Deputat", file: "deputat-daten.json", folder: "deputat", tab: "deputat" }
  };
  var ORDER = ["seminarbuch", "betreuung", "gfv", "deputat"];
  var APP_IDS = { "seminarbuch": "seminarbuch", "betreuungsuebersicht": "betreuung", "gfv-protokolle": "gfv", "deputat": "deputat" };

  // Welches Tool? Zuerst über das Feld "app", sonst über typische Felder (ältere Sicherungen).
  function detect(obj) {
    if (!obj || typeof obj !== "object") return null;
    if (obj.app && APP_IDS[obj.app]) return APP_IDS[obj.app];
    if (Array.isArray(obj.courses) && Array.isArray(obj.semesters)) return "seminarbuch";
    if (Array.isArray(obj.theses)) return "betreuung";
    if (Array.isArray(obj.protocols)) return "gfv";
    if (Array.isArray(obj.people) && Array.isArray(obj.semesters)) return "deputat";
    return null;
  }

  function parse(text, fileName) {
    var obj;
    try { obj = JSON.parse(text); } catch (e) { throw new Error((fileName || "Datei") + " ist keine gültige JSON-Datei."); }
    var tool = detect(obj);
    if (!tool) throw new Error((fileName || "Datei") + " gehört zu keinem der vier Tools.");
    var data = NORMALIZE[tool](obj);
    var backup = !obj.app;
    return { tool: tool, data: data, meta: { rev: obj.rev != null ? Number(obj.rev) : null, savedAt: obj.savedAt || null, device: obj.device || null, fileName: fileName || "", isBackup: backup } };
  }

  // ---------- Hilfen ----------
  function cmpName(a, b) { return String(a || "").localeCompare(String(b || ""), "de", { sensitivity: "base" }); }
  function todayISO(d) { d = d || new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function fold(s) { return String(s == null ? "" : s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ß/g, "ss"); }

  // ---------- Normalisieren ----------
  var NORMALIZE = {
    seminarbuch: function (o) {
      var sems = (o.semesters || []).slice().sort(function (a, b) { return (b.sortKey || 0) - (a.sortKey || 0); });
      var courses = (o.courses || []).map(function (c) {
        c.students = (c.students || []).slice().sort(function (a, b) { return cmpName(a.name, b.name); });

      var tot = { raw: 0, credit: 0, kolloq: 0, report: 0, warn: 0, ma: 0, ba: 0 };
      ev.rows.forEach(function (x) { tot.raw += x.raw; tot.credit += x.credit; tot.kolloq += x.kolloq; tot.report += x.report; if (x.level) tot.warn++; tot.ma += x.counts.ma1 + x.counts.ma2; tot.ba += x.counts.ba1 + x.counts.ba2; });
      h += '<div class="tiles">' + tileHtml("Meldewert", fmt(tot.report), "SWS nach Abzug Kolloquium") + tileHtml("Anrechnung", fmt(tot.credit), "SWS nach Regeln") + tileHtml("Arbeiten", tot.ma + tot.ba, tot.ma + " M.A. · " + tot.ba + " B.A.") + tileHtml("Zu besprechen", tot.warn, "Unter-/Überschreitungen") + "</div>";
      var lastG = null;
      h += '<div class="list" role="list">';
      ev.rows.forEach(function (x) {
        if (x.status !== lastG) { lastG = x.status; h += '<div class="group-head">' + esc(DEP.GROUP[lastG].long) + "</div>"; }
        var hint = x.notes.map(function (n) { return '<span class="' + (n.l ? "hint-" + n.l : "") + '">' + esc(n.t) + "</span>"; }).join("; ");
        h += '<button class="row" style="border-top:1px solid var(--line)" ' + nav({ name: "person", id: x.p.id, year: r.year }) + '><div class="row-main"><div class="row-title">' + esc(x.p.name) + (DEP.personState(x.p) === "gone" ? ' <span class="pill neutral">ausgeschieden</span>' : "") + "</div>" +
          (x.statusLabel !== DEP.GROUP[x.status].label ? '<div class="row-sub">' + esc(x.statusLabel) + "</div>" : "") +
          '<div class="row-sub">M.A. ' + x.counts.ma1 + "/" + x.counts.ma2 + " · B.A. " + x.counts.ba1 + "/" + x.counts.ba2 + " · Rechenwert " + fmt(x.raw) + "</div>" +
          (hint ? '<div class="row-sub" style="font-size:.8rem">' + hint + "</div>" : "") +
          '</div><div class="row-end"><div class="mono" style="font-size:1.05rem;color:var(--ink);font-weight:500">' + fmt(x.report) + '</div><div style="font-size:.72rem">Meldewert</div></div>' + CHEV + "</button>";
      });
      h += "</div>";
      h += '<p class="faint" style="margin:0;font-size:.8rem">M.A./B.A. jeweils Erst-/Zweitbetreuung. Meldewert = Anrechnung minus angerechnetes Kolloquium.</p>';
    }
    h += rulesHtml() + "</div>";
    els.view.innerHTML = h;
    document.getElementById("ysel").addEventListener("change", function (e) { r.year = parseInt(e.target.value, 10); VIEWS.deputat(r); });
  };
  function tileHtml(label, value, hint) { return '<div class="tile plain"><span class="tile-label">' + esc(label) + '</span><span class="tile-value">' + esc(value) + '</span><span class="tile-hint">' + esc(hint) + "</span></div>"; }
  function rulesHtml() {
    return '<details class="rules"><summary>Regeln</summary><ul><li>Gewichtung: M.A. Erst 0,3 · M.A. Zweit 0,1 · B.A. Erst 0,2 · B.A. Zweit 0,1 SWS.</li>' +
      DEP.GROUPS.filter(function (g) { return g.key !== "jp1" && g.key !== "jp2"; }).map(function (g) { return "<li><b>" + esc(g.label) + ":</b> " + esc(g.rule) + "</li>"; }).join("") +
      "<li>Akademisches Jahr = WiSe + folgendes SoSe. Bei Statuswechsel oder nur einem erfassten Semester gilt je Semester die halbe Jahresregel.</li><li>Kolloquium (Abzug je Semester mit angebotenem Kolloquium): Prof. 2 SWS, Dauerstelle und JP 2. Phase 1 SWS.</li></ul></details>";
  }
  VIEWS.person = function (r) {
    var st = DS.deputat && DS.deputat.data, p = st && st.people.filter(function (x) { return x.id === r.id; })[0];
    if (!p) { setHeader("Betreuende", "deputat"); els.view.innerHTML = '<div class="empty"><p>Nicht mehr vorhanden.</p></div>'; return; }
    setHeader(p.name, "deputat");
    var fmt = DEP.fmt, g = DEP.GROUP[p.status] || DEP.GROUP.ohne;
    var period = (p.start ? "ab " + DEP.semLabel(p.start) : "") + (p.start && p.end ? " " : "") + (p.end ? "bis " + DEP.semLabel(p.end) : "");
    var h = '<div class="stack"><div class="stack" style="gap:6px"><p class="eyebrow">' + esc(g.label) + (p.status === "jp" && p.jpPhase2 ? " · 2. Phase ab " + esc(DEP.semLabel(p.jpPhase2)) : "") + '</p><p class="lead">' + esc(p.name) + '</p><div class="meta">' + (period ? "<span>" + esc(period) + "</span>" : "") + (DEP.personState(p) === "gone" ? '<span class="pill neutral">ausgeschieden</span>' : "") + "</div></div>";
    if (p.note) h += '<div class="card">' + noteHtml(p.note) + "</div>";
    // Jahre mit Einträgen
    var years = DEP.yearsAvailable(st).filter(function (y) { return st.semesters.some(function (s) { return DEP.semAcadYear(s.id) === y && s.entries[p.id]; }); });
    if (!years.length) h += '<p class="faint">In keinem Semester eingetragen.</p>';
    years.forEach(function (y) {
      var ev = DEP.evaluateYear(st, y), row = ev.rows.filter(function (x) { return x.p.id === p.id; })[0];
      if (!row) return;
      h += '<section class="stack" style="gap:8px"><h2 class="sec">' + DEP.yearLabel(y) + '</h2><div class="card">';
      row.segs.forEach(function (sg) {
        h += '<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;gap:8px"><b>' + esc(DEP.semLabel(sg.sem.id)) + '</b><span class="muted" style="font-size:.84rem">' + esc(DEP.GROUP[sg.status].label) + (DEP.KOLLOQ[sg.status] ? (DEP.kollOffered(sg.e) ? " · Kolloquium" : " · kein Kolloquium") : "") + "</span></div>" +
          '<div class="dep-num">' + DEP.KINDS.map(function (k) { return "<div><b>" + (parseInt(sg.e[k.key], 10) || 0) + "</b>" + esc(k.short) + "</div>"; }).join("") + "</div></div>";
      });
      h += '<dl class="fields" style="border-top:1px solid var(--line)"><dt>Rechenwert</dt><dd class="mono">' + fmt(row.raw) + " SWS</dd><dt>Anrechnung</dt><dd class=\"mono\">" + fmt(row.credit) + " SWS</dd><dt>Kolloquium</dt><dd class=\"mono\">" + (row.kolloq ? "−" + fmt(row.kolloq) : "–") + "</dd><dt><b>Meldewert</b></dt><dd class=\"mono\"><b>" + fmt(row.report) + " SWS</b></dd>" +
        (row.notes.length ? "<dt>Hinweis</dt><dd>" + row.notes.map(function (n) { return '<span class="' + (n.l ? "hint-" + n.l : "") + '">' + esc(n.t) + "</span>"; }).join("<br>") + "</dd>" : "") + "</dl></div></section>";
    });
    els.view.innerHTML = h + "</div>";
  };

  // ---------- Dateien einlesen ----------
  function readFile(f) {
    return new Promise(function (res, rej) {
      var fr = new FileReader();
      fr.onload = function () { res(fr.result); };
      fr.onerror = function () { rej(fr.error || new Error("Lesefehler")); };
      fr.readAsText(f, "utf-8");
    });
  }
  function importFiles(files) {
    var ok = [], bad = [];
    return Promise.all(Array.prototype.map.call(files, function (f) {
      return readFile(f).then(function (text) {
        var p = W.parse(text, f.name);
        var prev = DS[p.tool];
        if (prev && prev.meta.savedAt && p.meta.savedAt && p.meta.savedAt < prev.meta.savedAt) {
          bad.push(f.name + ": älter als der vorhandene Stand, nicht übernommen");
          return;
        }
        return Store.put(p.tool, { text: text, fileName: f.name, loadedAt: new Date().toISOString() }).then(function (saved) {
          if (!saved) bad.push(f.name + ": konnte nicht dauerhaft gespeichert werden (nur bis zum Schließen)");
          ok.push(W.TOOLS[p.tool].label);
          DS[p.tool] = { data: p.data, meta: p.meta, loadedAt: new Date().toISOString(), size: text.length };
        });
      }).catch(function (e) { bad.push(e.message || String(e)); });
    })).then(function () {
      INDEX = W.buildIndex(DS);
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(function (x) { persisted = x; }).catch(function () {});
      if (ok.length) toast(ok.length > 1 ? ok.length + " Dateien eingelesen" : ok[0] + " eingelesen");
      render(false);
      if (bad.length) {
        var n = document.createElement("div"); n.className = "notice"; n.style.marginBottom = "14px";
        n.innerHTML = "<div>" + bad.map(esc).join("<br>") + "</div>";
        els.view.insertBefore(n, els.view.firstChild);
      }
    });
  }

  // ---------- Ereignisse ----------
  document.addEventListener("click", function (e) {
    var n = e.target.closest("[data-nav]");
    if (n) {
      var r = JSON.parse(n.getAttribute("data-nav"));
      if (r.replace) { delete r.replace; var top = cur(); if (top && top.fromSearch) r.fromSearch = true; stack[stack.length - 1] = r; render(true); }
      else go(r);
      return;
    }
    var t = e.target.closest("[data-tab]");
    if (t) { setTab(t.dataset.tab); return; }
    if (e.target.closest("[data-pick]")) { els.file.value = ""; els.file.click(); return; }
    var cp = e.target.closest("[data-copy]");
    if (cp) {
      var txt = cp.getAttribute("data-copy");
      var done = function () { toast("Pfad kopiert"); };
      try { navigator.clipboard.writeText(txt).then(done, function () { selectText(cp); }); } catch (err) { selectText(cp); }
    }
  });
  function selectText(btn) { var p = btn.parentNode.querySelector(".path"); if (!p) return; var rg = document.createRange(); rg.selectNodeContents(p); var s = window.getSelection(); s.removeAllRanges(); s.addRange(rg); toast("Pfad markiert"); }
  document.querySelectorAll(".tab").forEach(function (b) { b.addEventListener("click", function () { setTab(b.dataset.t); }); });
  els.back.addEventListener("click", back);
  els.dataBtn.addEventListener("click", function () { if (cur().name === "daten") return; go({ name: "daten" }); });
  els.file.addEventListener("change", function () { if (els.file.files && els.file.files.length) importFiles(els.file.files); });

  // Offline-Fähigkeit (nur auf der eigenen Webadresse, z. B. GitHub Pages; im Artifact ohne Wirkung)
  try {
    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
      var hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register("sw.js").catch(function () {});
      navigator.serviceWorker.addEventListener("controllerchange", function () { if (hadController) toast("Neue Version geladen"); hadController = true; });
    }
  } catch (e) {}

  // Start
  stack = [{ name: "home" }];
  if (navigator.storage && navigator.storage.persisted) navigator.storage.persisted().then(function (x) { persisted = x; }).catch(function () {});
  els.view.innerHTML = '<p class="faint">Lade …</p>';
  loadAll().then(function () { render(true); }, function () { render(true); });
})();
</script>
